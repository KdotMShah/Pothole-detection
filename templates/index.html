<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potholes Detector</title>
    <style>
        /* Reset default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            color: #333;
            line-height: 1.6;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('static/pexels-pixabay-56832.jpg'); /* Add your background image here */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        h1 {
            color: #fff;
            margin-top: 20px;
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.4);
        }

        .container {
            max-width: 600px;
            margin: 20px;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.85); /* Light, semi-transparent background */
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: left;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-size: 1.2rem;
            color: #333;
            display: block;
            margin-bottom: 8px;
        }

        input[type="file"] {
            padding: 12px;
            font-size: 1rem;
            width: 100%;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
            transition: border 0.3s ease;
        }

        input[type="file"]:hover {
            border-color: #007BFF; /* Blue border on hover */
        }

        button {
            background-color: #007BFF; /* Modern blue */
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
        }

        button:hover {
            background-color: #0056b3; /* Darker blue on hover */
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 40px;
            font-size: 1rem;
            color: #777;
            text-align: center;
        }

        .footer a {
            color: #007BFF;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .footer p {
            font-size: 1rem;
        }

        /* Responsive design */
        @media screen and (max-width: 768px) {
            .container {
                padding: 25px;
                max-width: 90%;
            }

            h1 {
                font-size: 2.2rem;
            }

            button {
                font-size: 1rem;
            }
        }

    </style>
</head>
<body>
    <h1>POTHOLES DETECTOR</h1>
    <div class="container">
        <form action="{{ url_for('upload_file') }}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file">Choose a video file (.mp4, .avi, .mov):</label>
                <input type="file" name="file" id="file" required accept="video/mp4, video/avi, video/mov">
            </div>
            <button type="submit">Upload Video</button>
        </form>
    </div>

    <div class="footer">
        <p>Powered by <a href="#">The Potholes Detection Project Team</a></p>
    </div>
</body>
</html>
